services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-nextjs
    restart: unless-stopped
    ports:
      - "3999:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: ${DATABASE_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PUSH_INTERNAL_TOKEN: ${PUSH_INTERNAL_TOKEN}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      INVENTORY_API_URL: ${INVENTORY_API_URL}
      INVENTORY_WRITE_TOKEN: ${INVENTORY_WRITE_TOKEN}
      MCP_API_TOKEN: ${MCP_API_TOKEN}
      EQUIPMENT_API_URL: ${EQUIPMENT_API_URL}
      EQUIP_WRITE_TOKEN: ${EQUIP_WRITE_TOKEN}
      EQUIP_MCP_TOKEN: ${EQUIP_MCP_TOKEN}
      HR_API_URL: ${HR_API_URL}
      HR_PORTAL_TOKEN: ${HR_PORTAL_TOKEN}
      HR_WRITE_TOKEN: ${HR_WRITE_TOKEN}
      TRANSLATOR_HEALTH_URL: ${TRANSLATOR_HEALTH_URL:-http://192.168.0.83:8790/translator/healthz}
      CERT_CHECK_HOSTS: ${CERT_CHECK_HOSTS:-vanam.synology.me,192.168.0.210}
      CERT_CHECK_SERVERNAME: ${CERT_CHECK_SERVERNAME:-vanam.synology.me}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    networks:
      - internal
      - vanam-db-net

networks:
  internal:
    driver: bridge
  vanam-db-net:
    external: true
